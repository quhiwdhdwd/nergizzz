<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Seni Seviyorum</title>
<style>
body{
    margin:0;
    background:linear-gradient(135deg,#ff9ad5,#ffc1e3);
    font-family:'Comic Sans MS',cursive;
    text-align:center;
    color:#fff;
}
.container{
    background:rgba(255,255,255,0.15);
    margin:40px auto;
    width:90%;
    max-width:500px;
    padding:25px;
    border-radius:25px;
    box-shadow:0 0 25px rgba(255,105,180,0.7);
}
h1{
    font-size:36px;
}
p{
    font-size:18px;
    line-height:1.6;
}
.heart{
    font-size:70px;
    animation:pulse 1s infinite;
}
@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}
button{
    background:#ff4fa3;
    border:none;
    padding:12px 25px;
    border-radius:20px;
    color:white;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 0 15px rgba(255,0,130,0.8);
}
button:hover{
    background:#ff2b90;
}
#secret{
    display:none;
    margin-top:15px;
    font-size:18px;
    color:#fff7fb;
}
</style>
</head>
<body>

<div class="container">
    <div class="heart">💖</div>
    <h1>Canım Sevgilim</h1>
    <p>
        Seni tanıdığım gün hayatımın en güzel günü oldu 🥰<br>
        Gülüşün kalbimi eriten en güzel şey 💕<br>
        Gözlerin yıldızlardan daha parlak ✨<br><br>
        **Seni çooook seviyorum 😘**
    </p>

    <button onclick="showSecret()">Sürprize Tıkla 🎁</button>
    <div id="secret">
        💌 Sen benim en güzel hayalimsin...<br>
        İyi ki varsın, iyi ki benimsin 💗<br>
        Sonsuza kadar sen & ben ♾️
    </div>
</div>

<script>
function showSecret(){
    document.getElementById("secret").style.display="block";
}
</script>

</body>
</html>
