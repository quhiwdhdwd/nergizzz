<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Nərgizim 💗</title>
<style>
body{
    margin:0;
    background:linear-gradient(135deg,#ff7eb3,#ffc3d9);
    font-family:'Comic Sans MS',cursive;
    text-align:center;
    color:#fff;
}
.box{
    background:rgba(255,255,255,0.15);
    margin:40px auto;
    width:90%;
    max-width:520px;
    padding:30px;
    border-radius:30px;
    box-shadow:0 0 25px rgba(255,0,130,0.7);
}
h1{font-size:38px;}
p{font-size:18px; line-height:1.7;}
.heart{font-size:75px; animation:pulse 1s infinite;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.2);}100%{transform:scale(1);}}
button{
    background:#ff4fa3;
    border:none;
    padding:12px 28px;
    border-radius:25px;
    color:white;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 0 15px rgba(255,0,130,0.8);
}
button:hover{background:#ff2b90;}
#secret{display:none;margin-top:18px;font-size:18px;}
.counter{
    margin-top:15px;
    font-size:18px;
    background:rgba(255,255,255,0.15);
    padding:12px;
    border-radius:15px;
}
</style>
</head>
<body>

<div class="box">
    <div class="heart">💖</div>
    <h1>Nərgizim</h1>
    <p>
        Səni tanıdığım gün həyatım dəyişdi 😍<br>
        Gülüşün ürəyimin ən sevdiyi musiqidir 🎶<br>
        Gözlərin gecələrimin ulduzlarıdır ✨<br><br>
        <b>Səni çooooox sevirəm 💗</b>
    </p>

    <div class="counter" id="meetCounter"></div>
    <div class="counter" id="loveCounter"></div>

    <button onclick="openGift()">Sürprizə toxun 🎁</button>
    <div id="secret">
        💌 Nərgiz, sən mənim ən gözəl möcüzəmsən...<br>
        Hər günümün səbəbi sənsən 💕<br>
        Sonsuza qədər sən & mən ♾️
    </div>
</div>

<script>
function daysFrom(dateStr){
    let start=new Date(dateStr);
    let now=new Date();
    let diff=Math.floor((now-start)/(1000*60*60*24));
    return diff;
}

document.getElementById("meetCounter").innerHTML=
"📅 Tanış olduğumuz gündən: <b>"+daysFrom("2023-12-15")+" gün</b>";

document.getElementById("loveCounter").innerHTML=
"💑 Sevgili olduğumuz gündən: <b>"+daysFrom("2023-12-15")+" gün</b>";

function openGift(){
 document.getElementById("secret").style.display="block";
}
</script>

</body>
</html>
